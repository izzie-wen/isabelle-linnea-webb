media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: site
    label: Webbplatsinställningar
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: author_name, label: Författarnamn, type: string, required: true }
      - { name: site_title, label: Rubrik högst upp i menyraden, type: string, description: "Tomt = författarnamnet" }
      - { name: tagline, label: Rad under namnet, type: string }
      - name: start_page
        label: Startsida
        type: select
        description: "Sidan som visas på webbplatsens huvudadress. Väljer du För författare visas inte den gamla framsidan."
        options:
          values:
            - { value: writers, label: För författare }
            - { value: home, label: Framsidan (Hem) }
      - name: pages
        label: Sidor som syns
        type: object
        description: "Stäng av en sida så publiceras den inte alls (innehållet sparas och kan slås på igen). Startsidan syns alltid."
        fields:
          - { name: about, label: Om mig, type: boolean }
          - { name: books, label: Böcker, type: boolean }
          - { name: stories, label: Berättelser, type: boolean }
          - { name: blog, label: AI-research, type: boolean }
          - { name: writers, label: För författare, type: boolean }
          - { name: podd, label: Skrivkurs i audioform, type: boolean }
          - { name: other, label: Annat, type: boolean }
          - { name: contact, label: Kontakt, type: boolean }
      - { name: email, label: E-post, type: string }
      - { name: instagram, label: Instagram-länk, type: string }
      - { name: facebook, label: Facebook-länk, type: string }
      - { name: youtube, label: YouTube-länk, type: string }
      - { name: pinterest, label: Pinterest-länk, type: string }
      - { name: copyright, label: Copyright-text, type: string }
      - { name: footer_tagline, label: Text i sidfoten, type: string }
      - { name: newsletter_title, label: Nyhetsbrev – rubrik (ovanför sidfoten på alla sidor), type: string }
      - { name: newsletter_body, label: Nyhetsbrev – text, type: text }
      - { name: newsletter_button, label: Nyhetsbrev – text på knappen, type: string }

  - name: pages
    label: Sidor
    type: group
    items:
      - name: home
        label: Framsida
        type: file
        path: content/home.json
        format: json
        fields:
          - name: hero
            label: Banner
            type: object
            fields:
              - { name: eyebrow, label: Liten rubrik, type: string }
              - { name: title, label: Huvudrubrik, type: string }
              - { name: subtitle, label: Kursiv underrubrik, type: string }
              - { name: body, label: Text, type: text }
              - { name: image, label: Bannerbild, type: image }
          - name: about
            label: Om författaren
            type: object
            fields:
              - { name: title, label: Rubrik, type: string }
              - { name: body, label: Text, type: text }
              - { name: quote, label: Citat, type: text }
              - { name: image, label: Bild, type: image }
          - name: world
            label: Världen-sektion
            type: object
            fields:
              - { name: title, label: Rubrik, type: string }
              - { name: body, label: Text, type: text }
              - { name: image, label: Bild, type: image }

      - name: about
        label: Om mig
        type: file
        path: content/about.json
        format: json
        fields:
          - name: hero
            label: Intro
            type: object
            fields:
              - { name: title, label: Rubrik, type: string }
              - { name: subtitle, label: Underrubrik, type: string }
              - { name: body, label: Text, type: text }
              - { name: image, label: Porträtt, type: image }
          - name: path
            label: Min väg hit
            type: object
            fields:
              - { name: title, label: Rubrik, type: string }
              - { name: paragraphs, label: Stycken, type: text, list: true }
              - { name: image, label: Bild, type: image }
          - name: facts
            label: Snabba fakta
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - { name: label, label: Rubrik, type: string }
              - { name: value, label: Text, type: text }
          - name: process
            label: Min skrivprocess
            type: object
            fields:
              - { name: title, label: Rubrik, type: string }
              - { name: body, label: Text, type: text }
              - { name: image, label: Bild, type: image }
          - name: inspiration
            label: Inspiration
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: title, label: Rubrik, type: string }
              - { name: text, label: Text, type: text }
              - { name: image, label: Bild, type: image }
          - { name: quote, label: Slutcitat, type: text }

      - name: books
        label: Böcker
        type: file
        path: content/books.json
        format: json
        fields:
          - name: hero
            label: Banner
            type: object
            fields:
              - { name: title, label: Rubrik, type: string }
              - { name: subtitle, label: Underrubrik, type: string }
              - { name: body, label: Text, type: text }
              - { name: image, label: Bild, type: image }
          - name: featured
            label: Huvudbok
            type: object
            fields:
              - { name: title, label: Titel, type: string }
              - { name: kicker, label: Liten rubrik, type: string }
              - { name: tagline, label: Tagline, type: string }
              - { name: description, label: Beskrivning, type: text }
              - { name: genre, label: Genre, type: string }
              - { name: status, label: Status, type: string }
              - { name: image, label: Omslag, type: image }
          - name: other
            label: Andra verk
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: title, label: Titel, type: string }
              - { name: genre, label: Genre, type: string }
              - { name: description, label: Beskrivning, type: text }
              - { name: image, label: Bild, type: image }

      - name: writers
        label: För författare
        type: file
        path: content/writers.json
        format: json
        fields:
          - name: hero
            label: Banner
            type: object
            fields:
              - { name: eyebrow, label: Liten rubrik, type: string }
              - { name: title, label: Rubrik, type: string }
              - { name: body, label: Text, type: text }
              - { name: image, label: Bild, type: image }
          - name: podd
            label: Skrivkurs i audioform
            type: object
            fields:
              - { name: title, label: Rubrik, type: string }
              - { name: intro, label: Text, type: text }
              - { name: blocks, label: "Block som visas (nummer, det första blir stort)", type: number, list: true }
          - { name: printables_intro, label: Printables-intro, type: text }
          - name: printables
            label: Printables
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: title, label: Titel, type: string }
              - { name: image, label: Bild, type: image }
              - name: file
                label: Nedladdningsfil
                type: file
                options:
                  categories: [document]
                  extensions: [pdf, docx, zip]
                  rename: true
          - { name: tips_intro, label: "Skrivtips & guider – text (de fyra senaste blogginläggen visas)", type: text }
          - { name: guide_title, label: Skrivguide rubrik, type: string }
          - { name: guide_steps, label: Skrivguide steg, type: string, list: true }
          - name: guide_link
            label: Skrivguide knapp
            type: object
            fields:
              - { name: label, label: Text, type: string }
              - { name: url, label: Länk, type: string }
          - { name: quote, label: Citat, type: text }

      - name: other
        label: Annat
        type: file
        path: content/other.json
        format: json
        fields:
          - name: hero
            label: Banner
            type: object
            fields:
              - { name: eyebrow, label: Liten rubrik, type: string }
              - { name: title, label: Rubrik, type: string }
              - { name: body, label: Text, type: text }
              - { name: image, label: Bild, type: image }
          - name: cards
            label: Kort
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: title, label: Rubrik, type: string }
              - { name: text, label: Text, type: text }
              - { name: image, label: Bild, type: image }
              - { name: label, label: Knapptext, type: string }
              - { name: url, label: Länk, type: string }

      - name: contact
        label: Kontakt
        type: file
        path: content/contact.json
        format: json
        fields:
          - name: hero
            label: Banner
            type: object
            fields:
              - { name: title, label: Rubrik, type: string }
              - { name: subtitle, label: Underrubrik, type: string }
              - { name: body, label: Text, type: text }
              - { name: image, label: Bild, type: image }
          - { name: form_note, label: Text under formuläret, type: string }
          - name: reasons
            label: Andra sätt att kontakta mig (blir också ämnena i formuläret)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: title, label: Rubrik, type: string }
              - { name: text, label: Text, type: text }
              - name: icon
                label: Ikon
                type: select
                options:
                  values: ["bok", "penna", "personer", "pratbubbla"]
          - { name: faq_note, label: Text under vanliga frågor (länkar till formuläret), type: string }
          - name: faqs
            label: Vanliga frågor
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{q}"
            fields:
              - { name: q, label: Fråga, type: string }
              - { name: a, label: Svar, type: text }

      - name: podd_settings
        label: Skrivkurs i audioform – sidinställningar
        type: file
        path: content/podd.json
        format: json
        fields:
          - name: hero
            label: Banner
            type: object
            fields:
              - { name: title, label: Rubrik, type: string }
              - { name: subtitle, label: Underrubrik, type: text }
              - { name: image, label: Bild, type: image }
          - name: audio_base
            label: Adress till mappen med ljudfiler
            type: string
            description: "T.ex. https://isabellelinnea.b-cdn.net/podd – filerna i mappen ska heta avsnitt-001.mp3, avsnitt-002.mp3 osv. Lämna tomt om du hellre klistrar in en länk per avsnitt."
          - name: published_through
            label: Publicerade avsnitt till och med nummer
            type: number
            description: "Avsnitt med lägre eller samma nummer får automatiskt en ljudfil från adressen ovan. 0 = inga."

  - name: stories
    label: Berättelser
    type: collection
    path: content/stories
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [title, genre, year]
      sort: [title, genre, year]
    fields:
      - { name: slug, label: URL-namn, type: string, required: true, pattern: "^[a-z0-9-]+$" }
      - { name: title, label: Titel, type: string, required: true }
      - name: genre
        label: Genre
        type: select
        options:
          values: [Science fiction, Fantasy, Vardagsliv, Skräck, Feelgood]
      - { name: excerpt, label: Kort beskrivning, type: text }
      - { name: image, label: Kortbild, type: image }
      - { name: hero, label: Bannerbild, type: image }
      - { name: read_time, label: Lästid, type: string }
      - { name: word_count, label: Ordantal, type: string }
      - { name: year, label: År, type: string }
      - { name: date, label: Publicerad, type: date, description: "Styr vilka tre berättelser som visas som de senaste på framsidan (nyaste först). Utan datum används året." }
      - { name: themes, label: Teman, type: string }
      - { name: quote, label: Citat, type: text }
      - { name: body, label: Novelltext, type: text, required: true }

  - name: posts
    label: Blogginlägg
    type: collection
    path: content/posts
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [title, category, date]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: slug, label: URL-namn, type: string, required: true, pattern: "^[a-z0-9-]+$" }
      - { name: title, label: Titel, type: string, required: true }
      - { name: category, label: Kategori, type: string }
      - { name: date, label: Datum, type: date }
      - { name: excerpt, label: Kort beskrivning, type: text }
      - { name: image, label: Bild, type: image }
      - { name: body, label: Inläggstext, type: text }

  - name: podd_blocks
    label: Skrivkurs i audioform – block och avsnitt
    type: collection
    path: content/podd
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [number, title, category]
      sort: [number, title]
      default:
        sort: number
        order: asc
    fields:
      - { name: number, label: Blocknummer, type: number, required: true }
      - { name: title, label: Rubrik, type: string, required: true }
      - name: category
        label: Ämne (filterknapp)
        type: select
        options:
          values: ["Grunder", "Karaktärer", "Struktur & plot", "Scener & känslor", "Dialog", "Språk & stil", "Genre & värld", "Redigering", "Skrivprocess"]
      - { name: description, label: Beskrivning, type: text }
      - { name: caption, label: Citat på den stora bilden, type: string }
      - { name: image, label: Bild, type: image }
      - name: episodes
        label: Avsnitt
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{number}. {title}"
        fields:
          - { name: number, label: Avsnittsnummer, type: number, required: true }
          - { name: title, label: Titel, type: string, required: true }
          - { name: description, label: Kort beskrivning, type: text }
          - name: audio
            label: Ljudfil (länk)
            type: string
            description: "Direktlänk till mp3-filen. Behövs inte om adressen till ljudmappen är ifylld i Skrivkurs i audioform – sidinställningar."
          - { name: duration, label: "Längd (t.ex. 12:14) – valfritt, räknas annars ut automatiskt", type: string }
          - { name: notes, label: Anteckningar, type: text }
